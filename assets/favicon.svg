<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="top" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ff8a52"/>
      <stop offset="1" stop-color="#ff5a12"/>
    </linearGradient>
  </defs>
  <!-- key depth (the drop edge under every keycap on the site) -->
  <rect x="3" y="9" width="58" height="53" rx="10" fill="#121212"/>
  <!-- skirt -->
  <rect x="3" y="3" width="58" height="53" rx="10" fill="#c94000" stroke="#121212" stroke-width="3"/>
  <!-- top surface -->
  <rect x="9" y="6" width="46" height="40" rx="7" fill="url(#top)"/>
  <!-- legend -->
  <text x="32" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="-0.5" fill="#121212">AH</text>
</svg>
